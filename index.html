<!DOCTYPE html>
<html lang="km" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#09090b" />
    <title>CodeHub — គេហទំព័រ ភាសាសរសេរកូដ និងវិស្វកម្មកម្មវិធី</title>
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('codehub-theme')
          if (t === 'light') {
            document.documentElement.classList.remove('dark')
          }
          var l = localStorage.getItem('codehub-locale')
          if (l === 'en') {
            document.documentElement.lang = 'en'
          }
        } catch {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Kantumruy+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-white text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
